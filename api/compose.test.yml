name: teamdrop-api-test

services:
  postgres:
    image: bitnami/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRESQL_USERNAME=docker
      - POSTGRESQL_PASSWORD=docker
      - POSTGRESQL_DATABASE=teamdrop-test

  redis:
    image: redis
    ports:
      - "127.0.0.1:6379:6379"
