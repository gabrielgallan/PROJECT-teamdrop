name: teamdrop-test

services:
  postgres:
    container_name: teamdrop-postgres-test
    image: bitnami/postgresql
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRESQL_USERNAME: docker
      POSTGRESQL_PASSWORD: docker
      POSTGRESQL_DATABASE: teamdrop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d teamdrop"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    container_name: teamdrop-redis-test
    image: redis
    restart: unless-stopped
    ports:
      - "6380:6379"