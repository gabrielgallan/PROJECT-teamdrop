purpose:
  stands_in_for: Teamdrop files HTTP API, using the existing controllers, presenters and cursor DTO as its contract.
  unblocks: Local validation of the React files client without writing to PostgreSQL or Azure.
assumptions:
  - id: cursor-pages
    status: supported
    claim: The client requests ten files, forwards nextCursor, stops at null, and scopes each request to the selected team.
    reason: Existing listFiles DTO and service define limit and descending UUID cursor behavior.
    verification: files-http.test.ts passed against the local Postman simulation; files-state.test.ts covers stale team responses and retrying the same failed cursor.
    source: api/src/http/files/dtos/list-files.dto.ts; api/src/http/files/files.service.ts; app/tests/files-http.test.ts; app/tests/files-state.test.tsx
    updated_at: '2026-11-23'
  - id: multipart-and-public-links
    status: supported
    claim: The client sends the file multipart field with its name and bytes and generates public URLs without forwarding a Bearer token.
    reason: Existing uploadFile and generateUrl controller methods define these requests.
    verification: Local HTTP simulation accepted a multipart upload, then listed it only under its target team; repeated URL generation and a public download redirect were exercised. This does not validate live Azure configuration.
    source: api/src/http/files/files.controller.ts; api/src/http/files/presenters/files.presenter.ts; app/tests/files-http.test.ts
    updated_at: '2026-11-23'
  - id: ambiguous-upload
    status: unknown
    claim: An upload with a lost response may have completed on the server and cannot safely be retried automatically.
    reason: The existing endpoint has no idempotency key or upload status lookup.
    verification: The hook test keeps unconfirmed files in the queue, removes confirmed successes and reloads the first page. No automatic retry is attempted for a lost response. A real lost-response scenario with Azure was not exercised.
    source: api/src/http/files/files.service.ts; app/src/hooks/use-team-files.ts; app/tests/files-state.test.tsx
    updated_at: '2026-11-23'
  - id: qr-uses-public-url
    status: supported
    claim: The QR screen reuses the public URL request and preserves the listing when returning.
    reason: The QR action needs no new endpoint or backend behavior.
    verification: The browser flow ran against this HTTP simulation at 340x520, displayed the real QR SVG and returned to scrollTop 556 with focus restored. Five component tests cover expiry, latency, retry and cancellation. Real Azure links and mobile-camera scanning were not exercised.
    source: app/src/screens/file-qr-screen.tsx; app/src/screens/drops-screen.tsx; app/tests/file-qr.test.tsx
    updated_at: '2026-11-23'
fingerprints:
